<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}PULSO{% endblock %} · PULSO</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body>
  <header class="barra">
    <a class="marca" href="/?fuente={{ fuente }}">PULSO</a>
    <nav class="nav">
      {% for ruta, titulo in vistas %}
        <a href="{{ ruta }}?fuente={{ fuente }}" {% if ruta == ruta_actual %}aria-current="page"{% endif %}>{{ titulo }}</a>
      {% endfor %}
    </nav>
  </header>
  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
